<style>
  :root{
    box-sizing:border-box;
    --bg:#0e0b0a; --card:#1a1513; --card2:#221a17;
    --orange:#ff7a1a; --yellow:#ffd23f; --cream:#fff4e0; --muted:#c9b8a8;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0;background:var(--bg);color:var(--cream);font-family:'Poppins',sans-serif;}
  h1,h2,.logo,.price-total{font-family:'Anton',sans-serif;letter-spacing:.5px}
  header{
    padding:22px 16px 14px;text-align:center;
    background:radial-gradient(circle at 50% 0%,#3a1a08,#0e0b0a 70%);
    border-bottom:2px solid #3a2a1c;
  }
  .badge{display:inline-block;background:#111;border:3px solid var(--orange);border-radius:50%;
    width:74px;height:74px;line-height:68px;font-size:26px;margin-bottom:6px}
  .logo-img{display:block;width:150px;height:150px;margin:0 auto 2px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  header h1{font-size:28px;margin:4px 0 2px;background:linear-gradient(180deg,var(--yellow),var(--orange));
    -webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase}
  header p{margin:0;color:var(--muted);font-size:13px}
  header .contact{margin-top:6px;color:var(--muted);font-size:12px}
  .status{max-width:640px;margin:14px auto 0;padding:10px 16px;background:var(--card2);
    border:1px solid #3a2a1c;border-radius:12px;font-size:13.5px;display:flex;gap:8px;align-items:center}
  .status b{color:var(--yellow)}
  main{max-width:640px;margin:0 auto;padding:16px 14px 150px}
  .cat{margin:22px 0 2px;font-size:18px;color:var(--orange);text-transform:uppercase;border-left:4px solid var(--orange);padding-left:8px}
  .cat-hint{font-size:11.5px;color:var(--muted);margin:0 0 10px 12px;font-style:italic}
  .item{display:flex;justify-content:space-between;align-items:center;background:var(--card);
    border:1px solid #2a201b;border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .item-name{font-weight:600;font-size:14.5px}
  .item-price{color:var(--muted);font-size:13px;margin-top:2px}
  .qty{display:flex;align-items:center;gap:10px}
  .qty button{width:30px;height:30px;border-radius:8px;border:none;background:#2c211b;color:var(--cream);
    font-size:17px;cursor:pointer}
  .qty button.plus{background:var(--orange);color:#1a0d00}
  .qty span{min-width:16px;text-align:center;font-weight:700}
  fieldset{border:1px solid #3a2a1c;border-radius:14px;margin-top:20px;padding:14px}
  legend{color:var(--orange);font-weight:700;padding:0 6px}
  label{display:block;font-size:13.5px;margin:10px 0 4px;color:var(--muted)}
  input[type=text],select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3a2a1c;
    background:#0e0b0a;color:var(--cream);font-size:14px;font-family:inherit;resize:vertical}
  .toggle{display:flex;gap:8px;margin-top:6px}
  .toggle button{flex:1;padding:9px;border-radius:10px;border:1px solid #3a2a1c;background:#0e0b0a;
    color:var(--muted);font-weight:600;cursor:pointer;font-family:inherit}
  .toggle button.on{background:var(--orange);color:#1a0d00;border-color:var(--orange)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--card2);border:1px solid #3a2a1c;border-radius:18px 18px 0 0;width:100%;max-width:640px;
    max-height:92%;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .modal h2{margin:0 0 4px;font-size:22px;color:var(--yellow);font-weight:400}
  .modal .resumo{font-size:13px;color:var(--muted);margin-bottom:6px}
  .modal .resumo b{color:var(--cream)}
  .modal .row2{display:flex;gap:8px;margin-top:14px}
  .modal .cancel{flex:0 0 auto;padding:14px 16px;border-radius:12px;border:1px solid #3a2a1c;background:transparent;
    color:var(--muted);font-weight:600;font-family:inherit;cursor:pointer}
  .modal .send{margin-top:0;flex:1}
  .err{color:#ff6b5a;font-size:12.5px;margin-top:8px;display:none}
  .opt{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid #3a2a1c;border-radius:12px;
    padding:11px 12px;margin:8px 0 0;cursor:pointer;color:var(--cream);font-size:14px}
  .opt input{accent-color:var(--orange);width:18px;height:18px;margin:0}
  .opt .n{flex:1;font-weight:600}
  .opt .p{color:var(--yellow);font-size:13px}
  #sBtns{display:flex;gap:8px;margin-top:14px}
  .li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid #3a2a1c}
  .li-r{white-space:nowrap;color:var(--yellow);display:flex;align-items:center;gap:8px}
  .li-r button{width:24px;height:24px;border-radius:6px;border:none;background:#2c211b;color:var(--cream);cursor:pointer;font-size:14px}
  .cartbar{position:fixed;left:0;right:0;bottom:0;background:var(--card2);border-top:2px solid var(--orange);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
  .cartbar-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  .price-total{font-size:22px;color:var(--yellow)}
  .send{width:100%;margin-top:8px;padding:14px;border:none;border-radius:12px;font-weight:700;font-size:15.5px;
    background:linear-gradient(90deg,var(--orange),var(--yellow));color:#1a0d00;cursor:pointer}
  .send:disabled{opacity:.5}
  .empty{color:var(--muted);font-size:13px;text-align:center;margin-top:4px}
</style>
</head>

<script>
// ======= CONFIGURAÇÕES DA LANCHONETE =======
const WHATSAPP_NUMBER = "5511934853993";
const BUSY_LEVEL = "normal"; // "normal" | "moderado" | "ocupado" — troque nos horários de pico
// ============================================

// ADICIONAIS — pizza: preços do cardápio. lanche / dog / porcao: preços de EXEMPLO (confirmar e ajustar)
const ADDONS = {
  pizza:[
    {id:"bacon", name:"Bacon", price:2.50},
    {id:"azeitona", name:"Azeitona", price:2.50},
    {id:"milho", name:"Milho", price:2.50},
    {id:"alho", name:"Alho frito", price:2.50},
  ],
  lanche:[
    {id:"bacon", name:"Bacon", price:4.00},
    {id:"ovo", name:"Ovo", price:3.00},
    {id:"queijo", name:"Queijo extra", price:3.00},
    {id:"cheddar", name:"Cheddar", price:4.00},
  ],
  dog:[
    {id:"salsicha", name:"Salsicha extra", price:3.00},
    {id:"bacon", name:"Bacon", price:3.00},
    {id:"queijo", name:"Queijo", price:3.00},
    {id:"cheddar", name:"Cheddar", price:3.00},
  ],
  porcao:[
    {id:"cheddar", name:"Cheddar", price:5.00},
    {id:"bacon", name:"Bacon", price:5.00},
    {id:"parmesao", name:"Molho parmesão", price:5.00},
  ],
};

// "addon" na categoria (ou no item) define qual lista de adicionais aparece
const MENU = [
  {cat:"Lanches", addon:"lanche", items:[
    {id:"dog", name:"Dog Dois Irmãos", price:15.00, prep:6, addon:"dog"},
    {id:"burguer", name:"Irmãos Burguer", price:19.99, prep:9},
    {id:"verde", name:"Irmãos Verde", price:22.50, prep:9},
    {id:"calabrocolis", name:"Irmão Calabrócolis", price:27.99, prep:10},
    {id:"irmaozinho", name:"Irmãozinho (combo c/ batata e refri 200ml)", price:19.90, prep:10},
  ]},
  {cat:"Porções", addon:"porcao", items:[
    {id:"batata", name:"Batata frita", price:24.99, prep:10},
    {id:"batatacheddar", name:"Batata c/ cheddar e bacon ou molho parmesão", price:29.99, prep:12},
    {id:"calabresaaceb", name:"Calabresa acebolada", price:29.99, prep:10},
    {id:"combogrande", name:"Batata, anéis de cebola e calabresa acebolada", price:34.99, prep:14},
  ]},
  {cat:"Mini Pizza", addon:"pizza", items:[
    {id:"mpcalabresa", name:"Calabresa", price:7.50, prep:4},
    {id:"mppresunto", name:"Presunto e Queijo", price:7.50, prep:4},
    {id:"mpfrango", name:"Frango", price:7.50, prep:4},
    {id:"mpqueijo", name:"Queijo", price:7.50, prep:4},
    {id:"mpbrocolis", name:"Brócolis", price:7.50, prep:4},
  ]},
  {cat:"Brotinho (pizza pequena)", addon:"pizza", items:[
    {id:"brcalabresa", name:"Calabresa", price:29.99, prep:12},
    {id:"brpresunto", name:"Presunto e Queijo", price:29.99, prep:12},
    {id:"brfrango", name:"Frango", price:29.99, prep:12},
    {id:"brqueijo", name:"Queijo", price:29.99, prep:12},
    {id:"brbrocolis", name:"Brócolis", price:29.99, prep:12},
  ]},
  {cat:"Doces", items:[
    {id:"brigadeiro", name:"Brigadeiro", price:9.00, prep:2},
    {id:"churros", name:"Churros", price:9.00, prep:6},
  ]},
  {cat:"Açaí", hint:"informe o acompanhamento nas observações", items:[
    {id:"acai150", name:"Açaí 150gr", price:9.90, prep:3},
  ]},
  {cat:"Bebidas", items:[
    {id:"reflata", name:"Refrigerante lata", price:7.00, prep:1},
    {id:"ref1l", name:"Refrigerante 1L", price:12.00, prep:1},
    {id:"cervejaoriginal", name:"Cerveja Original", price:7.90, prep:1},
    {id:"cervejacorona", name:"Cerveja Corona", price:10.00, prep:1},
    {id:"agua", name:"Água", price:3.00, prep:1},
  ]},
  {cat:"Sucos Naturais", hint:"informe o sabor nas observações (acerola, laranja, maracujá, abacaxi, limão, frutas vermelhas)", items:[
    {id:"jarrasuco", name:"Jarra de suco 750ml", price:19.90, prep:3},
    {id:"coposuco", name:"Copo de suco 300ml", price:8.00, prep:2},
  ]},
];

const $ = id => document.getElementById(id);
const BUSY_MULT = {normal:1, moderado:1.3, ocupado:1.6};
const ITEMS = {};
MENU.forEach(c=>c.items.forEach(i=>{ ITEMS[i.id] = {...i, addon: i.addon || c.addon || null}; }));

let delivery = "retirada";
let lines = []; // {itemId, addons:[ids], qty}

function money(v){ return "R$ " + v.toFixed(2).replace(".", ","); }
function addonOf(it, id){ return ADDONS[it.addon].find(a=>a.id===id); }

// ---------- carrinho ----------
const keyOf = (itemId, ids) => itemId + "|" + [...ids].sort().join(",");
function findLine(itemId, ids){ const k = keyOf(itemId, ids); return lines.find(l => keyOf(l.itemId, l.addons) === k); }
function addToLine(itemId, ids, n){
  const l = findLine(itemId, ids);
  if(l) l.qty += n; else lines.push({itemId, addons:[...ids], qty:n});
}
function removeFromLine(line, n){ line.qty -= n; if(line.qty <= 0) lines = lines.filter(x => x !== line); }
function unitsOf(itemId){ return lines.filter(l=>l.itemId===itemId).reduce((a,l)=>a+l.qty,0); }
function plainCount(itemId){ const l = findLine(itemId, []); return l ? l.qty : 0; }
function unitPrice(l){
  const it = ITEMS[l.itemId];
  return it.price + l.addons.reduce((a,id)=>a + addonOf(it,id).price, 0);
}
function lineLabel(l){
  const it = ITEMS[l.itemId];
  const ad = l.addons.length ? " (com " + l.addons.map(id=>addonOf(it,id).name).join(", ") + ")" : "";
  return `${l.qty}x ${it.name}${ad}`;
}
const totalPrice = () => lines.reduce((a,l)=>a + unitPrice(l)*l.qty, 0);
const totalQty = () => lines.reduce((a,l)=>a + l.qty, 0);

function estimateWait(){
  const base = 10;
  const sum = lines.reduce((a,l)=> a + ITEMS[l.itemId].prep * l.qty, 0);
  let total = (base + sum*0.6) * BUSY_MULT[BUSY_LEVEL];
  total = Math.min(Math.max(total, 15), 60);
  return Math.round(total/5)*5;
}

function addUnit(itemId){
  addToLine(itemId, [], 1);
  refresh();
  if(ITEMS[itemId].addon) askAddons(itemId, true);
}
function removeUnit(itemId){
  let l = findLine(itemId, []);
  if(!l){ const ls = lines.filter(x=>x.itemId===itemId); l = ls[ls.length-1]; }
  if(l) removeFromLine(l, 1);
  refresh();
}

// ---------- janelinha de adicionais ----------
function showSheet({title, sub, options, buttons}){
  $("sTitle").textContent = title;
  $("sSub").textContent = sub || "";
  const o = $("sOpts"); o.innerHTML = "";
  (options || []).forEach(a=>{
    const lab = document.createElement("label"); lab.className = "opt";
    lab.innerHTML = `<input type="checkbox" value="${a.id}"><span class="n">${a.name}</span><span class="p">+ ${money(a.price)}</span>`;
    o.appendChild(lab);
  });
  const b = $("sBtns"); b.innerHTML = "";
  buttons.forEach(bt=>{
    const el = document.createElement("button");
    el.type = "button"; el.className = bt.primary ? "send" : "cancel"; el.textContent = bt.label;
    el.addEventListener("click", ()=>{
      const ids = [...o.querySelectorAll("input:checked")].map(x=>x.value);
      closeSheet(); if(bt.onClick) bt.onClick(ids);
    });
    b.appendChild(el);
  });
  $("sheetOverlay").classList.add("open");
}
function closeSheet(){ $("sheetOverlay").classList.remove("open"); }
$("sheetOverlay").addEventListener("click", e=>{ if(e.target === $("sheetOverlay")) closeSheet(); });

function askAddons(itemId, first){
  const it = ITEMS[itemId], plain = plainCount(itemId);
  if(plain <= 0) return;
  const title = first ? `Quer adicionar algo ao ${it.name}?`
    : (plain > 1 ? `E os outros ${plain} ${it.name}: quer algum adicional diferente?`
                 : `E o outro ${it.name}: quer algum adicional diferente?`);
  const sub = plain > 1 ? `Você tem ${plain} sem adicional. Marque o que quiser.` : "Marque os adicionais que quiser.";
  showSheet({title, sub, options: ADDONS[it.addon], buttons:[
    {label: first ? "Não, obrigado" : "Não, sem adicional"},
    {label:"Adicionar", primary:true, onClick: ids => { if(ids.length) chooseScope(itemId, ids); }},
  ]});
}
function chooseScope(itemId, ids){
  const it = ITEMS[itemId], plain = plainCount(itemId);
  if(plain <= 1){ applyAddons(itemId, ids, 1); return; }
  const names = ids.map(id=>addonOf(it,id).name).join(", ");
  showSheet({title:"Esse adicional é em qual?", sub:`${names} — você tem ${plain} ${it.name} sem adicional.`, buttons:[
    {label:"Só em 1 deles", onClick: ()=>{ applyAddons(itemId, ids, 1); askAddons(itemId, false); }},
    {label:`Nos ${plain}`, primary:true, onClick: ()=> applyAddons(itemId, ids, plain)},
  ]});
}
function applyAddons(itemId, ids, n){
  const p = findLine(itemId, []);
  if(!p) return;
  removeFromLine(p, n);
  addToLine(itemId, ids, n);
  refresh();
}

// ---------- tela ----------
function renderMenu(){
  $("menu").innerHTML = MENU.map(cat => `
    <div class="cat">${cat.cat}</div>
    ${cat.hint ? `<div class="cat-hint">${cat.hint}</div>` : ""}
    ${cat.items.map(it => `
      <div class="item">
        <div>
          <div class="item-name">${it.name}</div>
          <div class="item-price">${money(it.price)}</div>
        </div>
        <div class="qty">
          <button data-id="${it.id}" data-d="-1">–</button>
          <span id="q-${it.id}">0</span>
          <button class="plus" data-id="${it.id}" data-d="1">+</button>
        </div>
      </div>
    `).join("")}
  `).join("");
  $("menu").querySelectorAll("button[data-id]").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(b.dataset.d === "1") addUnit(b.dataset.id); else removeUnit(b.dataset.id);
    });
  });
}

function refresh(){
  Object.keys(ITEMS).forEach(id=>{ $("q-"+id).textContent = unitsOf(id); });
  update();
  if($("overlay").classList.contains("open")) renderResumo();
}

function update(){
  const q = totalQty();
  $("cartCount").textContent = q + (q===1 ? " item" : " itens");
  $("cartTotal").textContent = money(totalPrice());
  $("sendBtn").disabled = q === 0;
  $("emptyMsg").style.display = q > 0 ? "none" : "block";
  $("cartTime").textContent = q > 0 ? "≈ " + estimateWait() + " min" : "";
}

function updateStatusBanner(){
  const min = Math.round(10 * BUSY_MULT[BUSY_LEVEL] / 5) * 5;
  $("statusTime").textContent = `${min}–60 min`;
}

// ---------- finalizar pedido ----------
function renderResumo(){
  if(lines.length === 0){ closeModal(); return; }
  $("resumo").innerHTML = `Total: <b>${money(totalPrice())}</b> &nbsp;•&nbsp; Tempo estimado: <b>≈ ${estimateWait()} min</b>`;
  $("listaPedido").innerHTML = lines.map((l,i)=>`
    <div class="li"><span>${lineLabel(l)}</span>
    <span class="li-r">${money(unitPrice(l)*l.qty)} <button type="button" data-i="${i}" aria-label="Remover um">×</button></span></div>`).join("");
  $("listaPedido").querySelectorAll("button[data-i]").forEach(b=>{
    b.addEventListener("click", ()=>{ removeFromLine(lines[+b.dataset.i], 1); refresh(); });
  });
}

function setDelivery(mode){
  delivery = mode;
  $("btnRetirada").classList.toggle("on", mode==="retirada");
  $("btnEntrega").classList.toggle("on", mode==="entrega");
  $("enderecoWrap").style.display = mode==="entrega" ? "block" : "none";
  $("err").style.display = "none";
}
$("btnRetirada").addEventListener("click", ()=>setDelivery("retirada"));
$("btnEntrega").addEventListener("click", ()=>setDelivery("entrega"));

function showErr(msg, field){
  const e = $("err"); e.textContent = msg; e.style.display = "block";
  if(field) field.focus();
}

$("sendBtn").addEventListener("click", ()=>{
  if(lines.length === 0) return;
  $("err").style.display = "none";
  renderResumo();
  $("overlay").classList.add("open");
});
function closeModal(){ $("overlay").classList.remove("open"); }
$("cancelBtn").addEventListener("click", closeModal);
$("overlay").addEventListener("click", e=>{ if(e.target === $("overlay")) closeModal(); });

$("confirmBtn").addEventListener("click", ()=>{
  if(lines.length === 0) return;
  const nome = $("nome").value.trim();
  const rua = $("rua").value.trim();
  const bairro = $("bairro").value.trim();
  const compl = $("compl").value.trim();
  const obs = $("obs").value.trim();

  if(!nome) return showErr("Informe seu nome para continuar.", $("nome"));
  if(delivery === "entrega"){
    if(!rua) return showErr("Informe a rua e o número para a entrega.", $("rua"));
    if(!bairro) return showErr("Informe o bairro para a entrega.", $("bairro"));
  }
  const endereco = [rua, bairro, compl].filter(Boolean).join(" - ");

  let msg = "Olá! Gostaria de fazer o seguinte pedido no *Irmãos na Chapa*:\n\n";
  lines.forEach(l=>{ msg += `• ${lineLabel(l)} - ${money(unitPrice(l)*l.qty)}\n`; });
  msg += `\n*Total: ${money(totalPrice())}*`;
  msg += `\n*Nome:* ${nome}`;
  msg += `\n*Entrega:* ${delivery==="entrega" ? "Entrega" : "Retirada no local"}`;
  if(delivery === "entrega") msg += `\n*Endereço:* ${endereco}`;
  msg += `\n*Tempo estimado:* aproximadamente ${estimateWait()} minutos`;
  if(obs) msg += `\n*Observações:* ${obs}`;

  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, "_blank");
  closeModal();
});

renderMenu();
updateStatusBanner();
update();
</script>
</body>
</html>
